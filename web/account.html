<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 / 领号 · 小红书运营助手</title>
<!-- ============================================================
  账号页（2026-10-18 落地；10-18 三入口 + 随便逛逛改版）
  ------------------------------------------------------------
  这一站在「新手引导」和「问卷 / 工作台」之间：
    进门先查登录状态——已经登录的人整页跳过，直接按问卷进度送工作台或问卷页；
    没登录才停在这里，三个入口：
      直接登录（有号）/ 领一个号（不用短信验证）/ 随便逛逛（固定公用演示号）。
  「随便逛逛」两行：
    行业演示：装修建材 / 母婴 / 教培，整号全功能；
    档位体验：建材的免费 / 基础 / 升级 / 全功能，内容一样只差档位。
    演示号固定 8 个、公用、不重置；获客/AI客服是示例数据、只读；不真发笔记、不真跑获客；
    账号底子（人设 / 卖点 / 知识库 / 规划）只读，其余生成照常可用。
  档位功能对照不在这页——已经搬进新手引导（guide.html）框二。
  分流（与 gate.js 对齐）：
    领号成功 → start.html?fromAccount=1（新号先去问卷，2A）
    登录成功 → 问卷四步齐了 → popup.html?mode=big；没齐 → start.html?fromAccount=1（1A）
    演示号 / 已登录演示号进本页 → popup.html?mode=big
  从工作台没号被送来带 ?need=1，给一句提示，不改变上面的分流。
  ============================================================ -->
<script src="gate.js"></script>
<style>
  :root {
    --ink: #22303c; --ink2: #5a6b7a; --ink3: #8b9aa8;
    --line: #dbe4ec; --bg: #f1f6fa; --card: #fff;
    --ok: #0a7b5a; --err: #c62828; --warn: #b45309;
    --brand: #2b7fb8; --brand-deep: #16527c; --brand-soft: #eaf3f9; --brand-on: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #e9f2f9, var(--bg) 240px) fixed;
    color: var(--ink);
    font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 26px 18px 60px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .hidden { display: none !important; }

  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .top h1 { font-size: 20px; font-weight: 700; }
  .top .ver { font-size: 11px; color: var(--ink2); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .top .back { margin-left: auto; font-size: 12.5px; color: var(--ink2); text-decoration: none; }
  .top .back:hover { color: var(--brand-deep); text-decoration: underline; }

  .gd-hero {
    background: linear-gradient(135deg, var(--brand-deep), var(--brand));
    color: #fff; border-radius: 14px; padding: 22px 24px; margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(22, 82, 124, .22);
  }
  .gd-hero h2 { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .gd-hero p { font-size: 13.5px; color: #d7e9f6; line-height: 1.85; max-width: 820px; }
  .gd-hero p b { color: #fff; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px 20px; margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(22, 82, 124, .07);
  }
  .notice { border-radius: 12px; padding: 11px 15px; font-size: 13px; margin-bottom: 14px; line-height: 1.7; }
  .notice.warn { background: #fdf6e7; border: 1px solid #f0e0b8; color: #7a5a00; }
  .notice.err  { background: #fdeeee; border: 1px solid #f2cccc; color: var(--err); }
  .notice.info { background: #eef6f1; border: 1px solid #cfe7db; color: #14532d; }

  .loading { color: var(--ink2); font-size: 13.5px; padding: 10px 0; }
  .loading::after { content: "…"; }
  .boot { min-height: 60vh; display: flex; align-items: center; justify-content: center; }

  /* ── 有号 / 没号两张卡 ── */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .choice {
    text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 18px; cursor: pointer; font-family: inherit; color: var(--ink);
    box-shadow: 0 2px 8px rgba(22, 82, 124, .05);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .choice:hover { border-color: #a8cee5; box-shadow: 0 4px 14px rgba(22, 82, 124, .09); transform: translateY(-1px); }
  .choice.on { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(43, 127, 184, .12); }
  .choice .tag {
    font-size: 11px; font-weight: 700; color: var(--brand-deep); background: var(--brand-soft);
    border-radius: 6px; padding: 2px 8px; display: inline-block; margin-bottom: 9px;
  }
  .choice h3 { font-size: 16.5px; font-weight: 800; margin-bottom: 4px; }
  .choice p { font-size: 12.5px; color: var(--ink2); line-height: 1.7; }
  .choice .go { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--brand); }
  .choice.on .go::after { content: " · 已选"; color: var(--ink3); font-weight: 400; }

  /* ── 表单 ── */
  .form-title { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
  .form-sub { font-size: 12.5px; color: var(--ink2); margin-bottom: 14px; line-height: 1.75; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; }
  .field.full { grid-column: 1 / -1; }
  .field input {
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    font: inherit; font-size: 13.5px; color: var(--ink); outline: none;
    background: #fcfcfd; width: 100%;
  }
  .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(43, 127, 184, .12); background: #fff; }
  .field .hint { font-weight: 400; color: var(--ink3); font-size: 11.5px; line-height: 1.6; }
  .btn {
    border: none; border-radius: 10px; padding: 11px 22px; font: inherit;
    font-size: 14.5px; font-weight: 700; cursor: pointer; transition: .15s;
  }
  .btn.primary { background: var(--brand); color: var(--brand-on); box-shadow: 0 3px 10px rgba(43, 127, 184, .25); }
  .btn.primary:hover { background: var(--brand-deep); }
  .btn.primary:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink2); font-weight: 600; font-size: 13px; }
  .btn.ghost:hover { border-color: #a8cee5; color: var(--ink); background: var(--brand-soft); }
  .form-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
  .link {
    color: var(--brand-deep); text-decoration: underline; cursor: pointer;
    font-size: 12.5px; background: none; border: none; font-family: inherit; padding: 0;
  }
  .err {
    background: #fdeeee; border: 1px solid #f2cccc; color: var(--err);
    border-radius: 9px; padding: 8px 11px; font-size: 12.5px; margin-bottom: 10px;
  }
  .note { font-size: 12px; color: var(--ink3); margin-top: 10px; line-height: 1.7; }

  /* ── 随便逛逛：演示号 ── */
  .choice-demo { grid-column: 1 / -1; background: linear-gradient(180deg, #fff, #f7fbfe); }
  .demo-panel { padding: 17px 20px 19px; }
  .demo-hd { margin-bottom: 14px; }
  .demo-hd h2 { font-size: 16px; font-weight: 800; }
  .demo-hd p { font-size: 12.5px; color: var(--ink2); line-height: 1.75; margin-top: 3px; }
  .demo-hd p b { color: var(--ink); }
  .demo-row + .demo-row { margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--line); }
  .demo-row-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
  .demo-row-hd b { font-size: 13.5px; font-weight: 800; }
  .demo-row-hd span { font-size: 11.5px; color: var(--ink3); }
  .demo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .demo-grid.four { grid-template-columns: repeat(4, 1fr); }
  .demo-item {
    position: relative; text-align: left; background: #fff; border: 1.5px solid var(--line);
    border-radius: 11px; padding: 13px 14px; cursor: pointer; font-family: inherit; color: var(--ink);
    display: flex; flex-direction: column; gap: 3px; transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .demo-item:hover { border-color: #a8cee5; box-shadow: 0 4px 12px rgba(22, 82, 124, .09); transform: translateY(-1px); }
  .demo-item:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
  .demo-item .di-tier {
    align-self: flex-start; font-size: 10.5px; font-weight: 700; color: var(--brand-deep);
    background: var(--brand-soft); border-radius: 5px; padding: 1px 7px; margin-bottom: 3px;
  }
  .demo-item .di-name { font-size: 15px; font-weight: 800; }
  .demo-item .di-desc { font-size: 11.5px; color: var(--ink2); line-height: 1.6; }
  .demo-item .di-go { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--brand); }
  .demo-item .di-go::after { content: " →"; }
  .demo-loading { font-size: 13px; color: var(--ink2); padding: 6px 0; }

  .page-foot { text-align: center; font-size: 12px; color: var(--ink3); line-height: 1.8; }
  .page-foot a { color: var(--brand-deep); text-decoration: underline; }

  @media (max-width: 900px) {
    .demo-grid, .demo-grid.four { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    body { padding: 18px 14px 48px; }
    .gd-hero { padding: 16px 18px; }
    .gd-hero h2 { font-size: 17px; }
    .card { padding: 16px 15px 18px; }
    .choices { grid-template-columns: 1fr; }
    .fields { grid-template-columns: 1fr; }
    .demo-panel { padding: 15px 14px 17px; }
    .demo-grid, .demo-grid.four { grid-template-columns: 1fr; }
    .top .back { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<div class="boot" id="bootScreen">
  <div class="loading">正在确认登录状态</div>
</div>
<div class="wrap hidden" id="pageBody">

  <div class="top">
    <h1>登录 / 领号</h1><span class="ver">第 2 步 · 账号</span>
    <a class="back" href="guide.html">← 回新手引导</a>
  </div>

  <div class="gd-hero">
    <h2>先确认账号，再开始用</h2>
    <p>进门先看登录状态：<b>已经登录会自动跳过这一页</b>，直接按你的进度往下走。<br>
       没登录就停在这里——有号登录，没号领一个，<b>不用短信验证</b>；<b>也可以先随便逛逛</b>，拿演示号进去试，不用注册。</p>
  </div>

  <div class="notice warn hidden" id="pageNotice"></div>

  <div class="hidden" id="accountMain">
    <div class="choices">
      <button type="button" class="choice" data-pick="login">
        <span class="tag">我有号</span>
        <h3>直接登录</h3>
        <p>用领号时的手机号和密码登录。之前填的人设、卖点、知识库、规划都还在。</p>
        <div class="go">去登录</div>
      </button>
      <button type="button" class="choice" data-pick="signup">
        <span class="tag">我还没号</span>
        <h3>领一个号</h3>
        <p>一个手机号领一个号，不用短信验证。领完先去填 7 道题，把账号底子建起来。</p>
        <div class="go">去领号</div>
      </button>
      <button type="button" class="choice choice-demo" data-pick="demo">
        <span class="tag">先不注册</span>
        <h3>随便逛逛</h3>
        <p>拿现成的演示号进去试：挑一个行业，或看四个档位各能干什么。演示号是公用的，获客和 AI客服里都是示例数据、只读；不会真发笔记，也不会真评论或私信。</p>
        <div class="go">选一个演示号</div>
      </button>
    </div>

    <div id="formBox"></div>
    <div id="demoBox" class="hidden"></div>

    <div class="page-foot">装执行器（三步）在 <a href="setup.html">这一页</a>；已经登录的人再打开本页会被直接放行，不会再问登录。各档位功能对照在新手引导里。</div>
  </div>

</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const QS = new URLSearchParams(location.search);
  const NEXT = QS.get('next') || '';
  let mode = null;          // 'login' | 'signup' | 'demo'
  let submitting = false;
  let demoBusy = false;
  let demosLoaded = false;
  let demosLoading = false;

  function showNotice(kind, html) {
    const n = $('pageNotice');
    n.className = 'notice ' + kind;
    n.innerHTML = html;
    n.classList.remove('hidden');
  }

  function renderForm() {
    const box = $('formBox');
    if (!mode) {
      box.innerHTML = '';
      return;
    }
    if (mode === 'demo') { box.innerHTML = ''; return; }
    const login = mode === 'login';
    box.innerHTML = `
      <div class="card">
        <div class="form-title">${login ? '登录你的号' : '领一个号'}</div>
        <div class="form-sub">${login
          ? '用领号时的手机号和密码登录，之前的东西都在。'
          : '不用短信验证，一个手机号一个号；领完先去填 7 道题。'}</div>
        <div class="err hidden" id="formErr"></div>
        <form id="acctForm" novalidate>
          <div class="fields">
            ${login ? '' : `
            <label class="field full">称呼
              <input id="fName" type="text" maxlength="24" placeholder="例：张老板 / 老周 / 小唐" autocomplete="name">
              <span class="hint">后面生成的人设、话术会按这个称呼叫你。</span>
            </label>`}
            <label class="field ${login ? 'full' : ''}">手机号（就是你的账号）
              <input id="fPhone" type="tel" maxlength="11" inputmode="numeric" placeholder="11 位手机号" autocomplete="tel">
            </label>
            <label class="field ${login ? 'full' : ''}">密码
              <input id="fPass" type="password" maxlength="32" placeholder="至少 6 位" autocomplete="${login ? 'current-password' : 'new-password'}">
            </label>
          </div>
          <div class="form-actions">
            <button class="btn primary" type="submit" id="acctSubmit">${login ? '登录，继续' : '领号，继续'}</button>
            <button class="link" type="button" data-pick="${login ? 'signup' : 'login'}">${login ? '还没号？领一个' : '已经有号？去登录'}</button>
          </div>
        </form>
        <div class="note">${login
          ? '登录后按你问卷的进度走：已经生成过账号底子就直接进工作台，没生成过就先去问卷页。'
          : '领完号先去问卷页填 7 道题，AI 会把账号底子写好；不想填也能跳过，先逛工作台。'}</div>
      </div>`;
    const first = $('fName') || $('fPhone');
    if (first) setTimeout(() => first.focus(), 40);
  }

  function showFormErr(msg) {
    const box = $('formErr');
    if (!box) return;
    box.textContent = msg;
    box.classList.remove('hidden');
  }

  /* ── 随便逛逛：固定公用演示号 ── */
  function demoCard(d) {
    const isTier = d.group === 'tier';
    const title = isTier ? '建材档位体验' : (d.name || d.industry || '演示号');
    const tierLabel = isTier ? (d.tier + '档') : '全功能';
    return `<button type="button" class="demo-item" data-demo="${esc(d.key)}">
      <span class="di-tier">${esc(tierLabel)}</span>
      <span class="di-name">${esc(title)}</span>
      <span class="di-desc">${esc(d.desc || '')}</span>
      <span class="di-go">进去逛</span>
    </button>`;
  }

  function renderDemos(list) {
    const box = $('demoBox');
    const industry = list.filter((d) => d.group === 'industry');
    const tier = list.filter((d) => d.group === 'tier');
    if (!industry.length && !tier.length) {
      box.innerHTML = '<div class="card demo-panel"><div class="err" style="margin:0;">暂时没有演示号——刷新一下再试。</div></div>';
      return;
    }
    box.innerHTML = `<section class="card demo-panel">
      <div class="demo-hd">
        <h2>挑一个演示号进去逛</h2>
        <p>演示号是公用的；获客和 AI客服里的客户 / 评论 / 私信都是<b>示例数据</b>，只读，看和搜都行。<b>不会真发笔记，也不会真评论 / 私信</b>。人设、卖点、知识库、规划这些账号底子也只读，写稿 / 出图 / 出片照常用。</p>
      </div>
      ${industry.length ? `<div class="demo-row">
        <div class="demo-row-hd"><b>按行业逛</b><span>整号功能全开</span></div>
        <div class="demo-grid">${industry.map(demoCard).join('')}</div>
      </div>` : ''}
      ${tier.length ? `<div class="demo-row">
        <div class="demo-row-hd"><b>按档位逛</b><span>都是建材内容，只有档位不同</span></div>
        <div class="demo-grid four">${tier.map(demoCard).join('')}</div>
      </div>` : ''}
      <div class="note">演示号不能挂执行器；想看你自己的号真跑起来，<a href="executor.html" style="color:var(--brand-deep);font-weight:700;">先看看执行器能干什么</a>。</div>
    </section>`;
  }

  async function loadDemos() {
    if (demosLoaded || demosLoading) return;
    demosLoading = true;
    const box = $('demoBox');
    box.innerHTML = '<div class="card demo-panel"><div class="demo-loading">正在准备演示号</div></div>';
    try {
      const j = await XhsGate.apiRaw('/api/auth/demos', {});
      if (!j || !j.ok) throw new Error((j && j.error) || '没取到演示号');
      renderDemos(Array.isArray(j.demos) ? j.demos : []);
      demosLoaded = true;
    } catch (e) {
      box.innerHTML = '<div class="card demo-panel"><div class="err" style="margin:0;">演示号没取到——检查一下服务器，再点一次「随便逛逛」。</div></div>';
    } finally {
      demosLoading = false;
    }
  }

  async function enterDemo(key, btn) {
    if (demoBusy) return;
    demoBusy = true;
    const go = btn.querySelector('.di-go');
    const oldGo = go ? go.textContent : '';
    btn.disabled = true;
    if (go) go.textContent = '正在进…';
    try {
      const j = await XhsGate.apiRaw('/api/auth/demo', { key });
      if (!j || !j.ok) throw new Error((j && j.error) || '演示号没打开');
      const me = j.account || null;
      if (me) { try { XhsGate.markSeen(me); } catch (_) {} }
      try { XhsGate.invalidate(); } catch (_) {}
      location.replace(NEXT === 'setup' ? 'setup.html' : 'popup.html?mode=big');
    } catch (e) {
      demoBusy = false;
      btn.disabled = false;
      if (go) go.textContent = oldGo;
      showNotice('err', esc(String((e && e.message) || e) || '演示号没打开，再试一次。'));
    }
  }

  function selectMode(next) {
    mode = next;
    document.querySelectorAll('.choice').forEach((el) => el.classList.toggle('on', el.dataset.pick === mode));
    const demoBox = $('demoBox');
    if (mode === 'demo') {
      demoBox.classList.remove('hidden');
      loadDemos();
    } else {
      demoBox.classList.add('hidden');
    }
    renderForm();
  }

  function routeLoggedIn(me, isOld) {
    try { XhsGate.markSeen(me); } catch (_) {}
    try { XhsGate.invalidate(); } catch (_) {}
    if (NEXT === 'setup') { location.replace('setup.html'); return; }
    if (me && me.kind === 'demo') { location.replace('popup.html?mode=big'); return; }
    location.replace(isOld ? 'popup.html?mode=big' : 'start.html?fromAccount=1');
  }

  async function boot() {
    let g = null;
    try { g = await XhsGate.check(true); } catch (_) { g = { err: true }; }
    $('bootScreen').classList.add('hidden');

    /* 已经登录：这一页一个字都不露，直接按进度送走 */
    if (g && g.me) { routeLoggedIn(g.me, !!g.isOld); return; }

    $('pageBody').classList.remove('hidden');
    if (g && g.err) {
      showNotice('warn', '连不上服务器——刷新一下试试，或看下服务器小黑窗还在不在。');
    } else if (NEXT === 'setup') {
      showNotice('warn', '装执行器要先登录：有号就登录，没号先领一个，完事回到装执行器那一页。');
    } else if (QS.get('need') === '1') {
      showNotice('warn', '进工作台要一个号——登录或领一个，完事按你的进度进去。');
    }
    $('accountMain').classList.remove('hidden');
    renderForm();
  }

  async function submit() {
    if (submitting) return;
    const phone = ($('fPhone') && $('fPhone').value || '').replace(/\s+/g, '');
    const pass = ($('fPass') && $('fPass').value) || '';
    const name = ($('fName') && $('fName').value.trim()) || '';
    if (!/^1\d{10}$/.test(phone)) return showFormErr('手机号填 11 位（1 开头）。');
    if (pass.length < 6) return showFormErr('密码至少 6 位。');
    if (mode === 'signup' && !name) return showFormErr('领号要填一个称呼，后面好叫你。');

    const btn = $('acctSubmit');
    const oldText = btn ? btn.textContent : '';
    submitting = true;
    if (btn) { btn.disabled = true; btn.textContent = mode === 'login' ? '登录中…' : '领号中…'; }
    try {
      const body = { phone, password: pass };
      if (mode === 'signup') body.name = name;
      const j = await XhsGate.apiRaw(mode === 'signup' ? '/api/auth/signup' : '/api/auth/login', body);
      if (!j || !j.ok) throw new Error((j && j.error) || '没成，再试一下');
      const me = j.account || null;
      if (!me) throw new Error('服务器没给回账号——再试一下');
      try { XhsGate.markSeen(me); } catch (_) {}
      try { XhsGate.invalidate(); } catch (_) {}

      if (mode === 'signup') {
        location.replace(NEXT === 'setup' ? 'setup.html' : 'start.html?fromAccount=1');
        return;
      }

      if (NEXT === 'setup') { location.replace('setup.html'); return; }
      let g = null;
      try { g = await XhsGate.check(true); } catch (_) {}
      location.replace((g && g.me && g.isOld) ? 'popup.html?mode=big' : 'start.html?fromAccount=1');
    } catch (e) {
      const msg = String((e && e.message) || e);
      showFormErr(/Failed to fetch|NetworkError|HTTP/.test(msg)
        ? '连不上服务器——检查一下网络，或看下服务器小黑窗还在不在。'
        : msg);
      submitting = false;
      if (btn) { btn.disabled = false; btn.textContent = oldText; }
    }
  }

  document.addEventListener('click', (e) => {
    const d = e.target.closest('[data-demo]');
    if (d) { enterDemo(d.dataset.demo, d); return; }
    const p = e.target.closest('[data-pick]');
    if (!p) return;
    selectMode(p.dataset.pick);
  });

  document.addEventListener('submit', (e) => {
    if (e.target && e.target.id === 'acctForm') {
      e.preventDefault();
      submit();
    }
  });

  boot();
})();
</script>
</body>
</html>
